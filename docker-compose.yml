name: bus-ai-ticketing

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - bus-network

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bus}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bus-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - bus-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bus-network

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - bus-network

  db-setup:
    <<: *app-build
    restart: "no"
    command: node scripts/ensure-databases.js
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/postgres
      DATABASE_NAMES: trip_db,booking_db,seat_db,analytics_db
    depends_on:
      postgres:
        condition: service_healthy

  trip-migrate:
    <<: *app-build
    restart: "no"
    command: sh -c "npm run db:migrate -w services/trip-service && npm run db:seed -w services/trip-service"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/trip_db
    depends_on:
      db-setup:
        condition: service_completed_successfully

  booking-migrate:
    <<: *app-build
    restart: "no"
    command: sh -c "npm run db:migrate -w services/booking-service && npm run db:seed -w services/booking-service"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/booking_db
    depends_on:
      db-setup:
        condition: service_completed_successfully

  seat-migrate:
    <<: *app-build
    restart: "no"
    command: sh -c "npm run db:migrate -w services/seat-service && npm run db:seed -w services/seat-service"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/seat_db
    depends_on:
      db-setup:
        condition: service_completed_successfully

  analytics-migrate:
    <<: *app-build
    restart: "no"
    command: sh -c "npm run db:migrate -w workers/analytics-worker && npm run db:seed -w workers/analytics-worker"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/analytics_db
    depends_on:
      db-setup:
        condition: service_completed_successfully

  web:
    <<: *app-build
    command: npm run dev -w apps/web
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4001/graphql
      GRAPHQL_URL: http://gateway:4000/graphql
    ports:
      - "3001:3000"
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    <<: *app-build
    command: npm run dev -w services/gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TRIP_SERVICE_URL: http://trip-service:4010
      BOOKING_SERVICE_URL: http://booking-service:4020
      AI_SERVICE_URL: http://ai-service:4100
      ANALYTICS_SERVICE_URL: http://analytics-worker:4050
      GATEWAY_GRPC_BIND: 0.0.0.0:50054
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
      GRAPHQL_ALLOWED_ORIGINS: ${GRAPHQL_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:3001}
      GRAPHQL_RATE_LIMIT: ${GRAPHQL_RATE_LIMIT:-120}
      ALLOW_GRAPHQL_INTROSPECTION: ${ALLOW_GRAPHQL_INTROSPECTION:-false}
    ports:
      - "4001:4000"
      - "50054:50054"
    depends_on:
      trip-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      analytics-worker:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/grpc-healthcheck.js", "localhost:50054", "gateway"]
      interval: 10s
      timeout: 5s
      retries: 20

  trip-service:
    <<: *app-build
    command: npm run dev -w services/trip-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/trip_db
      TRIP_GRPC_BIND: 0.0.0.0:50052
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
    ports:
      - "4010:4010"
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      trip-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/grpc-healthcheck.js", "localhost:50052", "trip-service"]
      interval: 10s
      timeout: 5s
      retries: 20

  seat-service:
    <<: *app-build
    command: npm run dev -w services/seat-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SEAT_GRPC_BIND: 0.0.0.0:50051
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/seat_db
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      seat-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/grpc-healthcheck.js", "localhost:50051", "seat-service"]
      interval: 10s
      timeout: 5s
      retries: 20

  booking-service:
    <<: *app-build
    command: npm run dev -w services/booking-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SEAT_GRPC_URL: seat-service:50051
      TRIP_SERVICE_URL: http://trip-service:4010
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/booking_db
      BOOKING_GRPC_BIND: 0.0.0.0:50053
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
      PENDING_PAYMENT_TTL_SECONDS: 900
      GUEST_ACCESS_TTL_SECONDS: 1800
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-local-payment-callback-secret-change-me}
    ports:
      - "4020:4020"
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
      seat-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/grpc-healthcheck.js", "localhost:50053", "booking-service"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai-service:
    <<: *app-build
    command: npm run dev -w services/ai-service
    env_file:
      - path: .env.local
        required: false
    environment:
      TRIP_SERVICE_URL: http://trip-service:4010
      BOOKING_SERVICE_URL: http://booking-service:4020
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  analytics-worker:
    <<: *app-build
    command: npm run dev -w workers/analytics-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:-bus}@postgres:5432/analytics_db
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
    ports:
      - "4050:4050"
    depends_on:
      postgres:
        condition: service_healthy
      analytics-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  ticket-worker:
    <<: *app-build
    command: npm run dev -w workers/ticket-worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-500}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  email-worker:
    <<: *app-build
    command: npm run dev -w workers/email-worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-500}
      DATA_DIR: /app/data
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@bus-ai.local}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost}
    volumes:
      - ./data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - bus-network

networks:
  bus-network:
    driver: bridge

volumes:
  postgres-data:
